# При создании тега вида v1.0.0 собирает portable-exe на Windows
# и прикладывает его к релизу на GitHub. Можно запустить и вручную (Actions → Run workflow).
name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python tests/test_logic.py
      - name: Smoke test on real Windows (read-only)
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: python tests/test_windows_smoke.py 2>&1 | Tee-Object -FilePath smoke.txt; exit $LASTEXITCODE
      - name: Smoke report
        if: always()
        shell: pwsh
        run: |
          $t = Get-Content smoke.txt -Raw -ErrorAction SilentlyContinue
          if (-not $t) { $t = 'no output' }
          $t = "outcome=${{ steps.smoke.outcome }}`n" + $t
          $t = $t.Substring(0, [Math]::Min($t.Length, 3500)) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          Write-Output "::notice title=smoke::$t"
      - name: Build portable exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --uac-admin --clean --name UpdateChecker-Portable update_checker.py
      - uses: actions/upload-artifact@v4
        with:
          name: UpdateChecker-Portable
          path: dist/UpdateChecker-Portable.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UpdateChecker-Portable.exe
          generate_release_notes: true
          body_path: release_notes.md
